name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ⚠️ 镜像名**刻意不在这里定义**。
  # 它必须优先取 `secrets.DOCKERHUB_USERNAME`：Docker Hub 命名空间是**全小写**的，
  # 且与 GitHub 用户名**不保证一致**；而 workflow 级 `env:` 取不到 `secrets` 上下文。
  # 统一由 `gate` job 解析并规范化后，用 job output 传给 build / merge。
  #
  # 这是 run #2 实测踩出来的（缺陷 D-11）：原来写的是
  # `vars.DOCKERHUB_USERNAME || github.repository_owner`，只配了 secret 没配 variable 时
  # 回退成 `LIUBANGJIAN`，buildx 直接报
  #   failed to push LIUBANGJIAN/download-gateway: ... lookup LIUBANGJIAN ...: no such host

jobs:
  # ---------- 0) 隐私脱敏闸门（public 仓库：命中即中止）----------
  #
  # 这是第二道防线。第一道是 `.gitignore`（`doc/*.token.txt`、`design/`、
  # `.workbuddy/` 等根本不进仓库）。两层都要有：
  # 只要有人 `git add -f` 强推了本地敏感文件，这里必须拦住。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描凭据 / 内网 IP / 弱口令
        run: |
          set -uo pipefail
          # 只放**强特征**：真实 token 格式、真实私网 IP、私钥块、AWS Key、
          # 以及「用户:口令」形态的弱口令。
          #
          # 刻意**不放**「明文提及敏感文件名」（如 `xxx.token.txt`）这类启发式：
          # ① 文件名不是凭据，价值极低；
          # ② 它是**自指**的 —— 任何解释这条规则的注释、任何列出待忽略文件的
          #    `.gitignore` 都会命中它，导致闸门永远红灯（本地实测确实如此，
          #    见 commit 说明里的 D-8）。
          # 文件级策略交给 `.gitignore`（第一道防线）。
          PAT='ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|dckr_pat_[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|(admin|root|user|guest):[A-Za-z0-9@._!-]{1,16}'
          if git grep -nIE "$PAT" -- . ; then
            echo "::error::命中敏感信息，拒绝构建与推送"
            exit 1
          fi
          echo "脱敏闸门通过：未发现凭据 / 内网 IP / 弱口令"

  # ---------- 1) 质量门 ----------
  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all --locked

      # TLS 后端闸门：Docker/Linux 下 schannel 不存在，
      # 一旦有人把 reqwest 改回 native-tls，这里必须失败（02 §0 A-1 / 00 §50-51）
      - name: 闸门 · 不得引入 native-tls
        run: |
          if grep -qE '^name = "native-tls"$' Cargo.lock; then
            echo "::error::Cargo.lock 含 native-tls —— Docker/Linux 下 TLS 将不可用"
            exit 1
          fi
          echo "TLS 后端检查通过（未引入 native-tls）"

      # 这条闸门替代了原来的「明文提及敏感文件名」启发式：
      # 它检查的是**真实风险**（凭据/设计文档被 `git add -f` 强推），而不是字面串。
      - name: 闸门 · 敏感文件不得进入版本控制
        run: |
          set -uo pipefail
          bad=0
          # ⚠️ 必须用 `git ls-files -z`：不带 `-z` 时，git 会给含**非 ASCII** 的路径
          # 加引号并做八进制转义（实测输出形如 `"design/__\351\227\270..."`），
          # 于是任何 `^design/` 这类锚定匹配都会失效 —— 而本项目要防的文件名
          # 恰好几乎全是中文。这就是「闸门看着在、实际是装饰」的典型静默失效：
          # 本地用纯 ASCII 文件名测会过，换成真实中文名就漏。
          # 另：用 `< <(...)` 而不是管道，否则 while 跑在子 shell 里，`bad=1` 传不回来。
          while IFS= read -r -d '' f; do
            case "$f" in
              design/*|*/design/*|*.token.txt|doc/*服务器*.txt|doc/BitComet*.txt|.env|*/.env)
                echo "::error file=$f::敏感文件被纳入版本控制（设计文档 / 凭据 / 环境文件）"
                bad=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "版本控制内容检查通过：无设计文档 / 凭据文件 / 环境文件"

      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # T10 落地前端后自动生效；当前 web/ 尚不存在，此步会被跳过
      - name: 前端构建
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm run build

  # ---------- 2) 发布条件判定 ----------
  #
  # 为什么要有这个 job：Docker Hub 凭据是**运行期配置**，不是代码。
  # 没有它的时候，「构建并推送」这条路必然失败 —— 但那**不是代码问题**。
  # 把两者解耦后：
  #   · 有凭据 → 构建 + push-by-digest + 合并多架构 manifest；
  #   · 无凭据 → **仍然构建镜像**（验证 Dockerfile 有效），只是不登录、不推送。
  # 这样「Dockerfile 是否可用」每次推送都能被验证，而红叉只用来表示真问题。
  #
  # 注意：secrets 不能直接用在 job 级 `if:` 里，故必须用这种「小 job 导出 output」的写法。
  gate:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - id: check
        env:
          SECRET_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VAR_USER: ${{ vars.DOCKERHUB_USERNAME }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail

          # ---- 一、解析镜像名（必须全小写，且以 secrets 里的 Docker Hub 用户名为准）----
          u="${SECRET_USER:-}"
          [ -n "$u" ] || u="${VAR_USER:-}"
          [ -n "$u" ] || u="${OWNER:-}"
          u="$(printf '%s' "$u" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$u" ] || printf '%s' "$u" | grep -q '[^a-z0-9._-]'; then
            echo "::error::无法解析出合法的 Docker Hub 命名空间：「$u」（只允许小写字母 / 数字 / . _ -）"
            exit 1
          fi
          echo "image=${u}/download-gateway" >> "$GITHUB_OUTPUT"
          echo "镜像名 = ${u}/download-gateway"

          # ---- 二、判定是否具备发布条件 ----
          if [ -n "${SECRET_USER:-}" ] && [ -n "${SECRET_TOKEN:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 凭据已配置：将构建并推送多架构镜像"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过镜像发布::Docker Hub 凭据未配置。请到 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN。本次仍会构建镜像以验证 Dockerfile。"
          fi

  # ---------- 3) 原生矩阵构建（amd64/arm64 各自原生，避 QEMU）----------
  #
  # 不用 QEMU 的原因（02 §5.2）：Rust 全量编译在仿真下要 40–90 分钟，
  # 而 ubuntu-24.04-arm 是原生 arm64 Runner，每格 5–8 分钟。
  build:
    needs: [test, gate]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 把镜像名与 --output 串**在 shell 里拼好并打印**，而不是用内联 ${{ format(...) }}：
      # ① 出问题时人眼能直接看到真实取值；② 空值在这里 fail fast，
      #    不至于让 buildx 丢一句 "tag is needed when pushing to registry" 让人去猜
      #    （该错误来自 buildx/build/build.go 的 prepareMultiDriverExports：
      #      push=true 但 name= 为空时抛出，所以「name 为空」是唯一可能的原因）。
      - name: 解析镜像名与 output 串
        id: params
        env:
          SECRET_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          VAR_USER: ${{ vars.DOCKERHUB_USERNAME }}
          OWNER: ${{ github.repository_owner }}
          PUBLISH: ${{ needs.gate.outputs.publish }}
        run: |
          set -uo pipefail
          u="${SECRET_USER:-}"
          [ -n "$u" ] || u="${VAR_USER:-}"
          [ -n "$u" ] || u="${OWNER:-}"
          u="$(printf '%s' "$u" | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$u" | grep -qE '^[a-z0-9][a-z0-9._-]*$'; then
            echo "::error::无法解析出合法的 Docker Hub 命名空间：「${u}」"
            exit 1
          fi
          IMG="${u}/download-gateway"
          if [ "${PUBLISH}" = "true" ]; then
            OUT="type=image,name=${IMG},push-by-digest=true,name-canonical=true,push=true"
          else
            OUT=""
          fi
          echo "image=${IMG}" >> "$GITHUB_OUTPUT"
          echo "outputs=${OUT}" >> "$GITHUB_OUTPUT"
          echo "解析结果 image=${IMG} publish=${PUBLISH} outputs=${OUT}"
          {
            echo "### 构建参数 · ${{ matrix.platform }}"
            echo ""
            echo "镜像名 \`${IMG}\`"
            echo ""
            echo "publish \`${PUBLISH}\`"
            echo ""
            echo "outputs \`${OUT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 登录 Docker Hub（仅发布时需要）
        if: needs.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.params.outputs.image }}

      - name: 构建镜像${{ needs.gate.outputs.publish == 'true' && '并推送' || '（仅验证，不推送）' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # 推送由 outputs 里的 `push=true` 控制 —— push-by-digest 必须用 `outputs` 形式，
          # 不能用 `push:` 快捷写法（那会退化成普通 tag 推送，拿不到逐架构 digest）。
          # 无凭据时 outputs 为空 ⇒ 只构建进 buildx 缓存（**Dockerfile 每一层仍被完整验证**）。
          outputs: ${{ steps.params.outputs.outputs }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}

      # 把关键取值变成**公开可读的错误注解**。
      # 原因：Actions 作业日志通过 API 拉取需要管理员权限（未认证返回 403
      # "Must have admin rights to Repository"），而失败步骤的错误注解是公开可读的。
      # 失败时把构建参数塞进 ::error::，排障就不必依赖日志。
      - name: 失败时输出构建参数（诊断）
        if: failure() && steps.params.outcome == 'success'
        run: |
          echo "::error title=构建参数::image=${{ steps.params.outputs.image }} | publish=${{ needs.gate.outputs.publish }} | outputs=${{ steps.params.outputs.outputs }}"

      - name: 收集 digest
        if: needs.gate.outputs.publish == 'true' && steps.build.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: needs.gate.outputs.publish == 'true' && steps.build.outcome == 'success'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ---------- 4) 合并为多架构 manifest ----------
  merge:
    needs: [build, gate]
    if: github.event_name != 'pull_request' && needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.gate.outputs.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags|map("-t "+.)|join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${{ needs.gate.outputs.image }}@sha256:%s " *)
      - name: Verify manifest
        run: |
          docker buildx imagetools inspect ${{ needs.gate.outputs.image }}:${{ steps.meta.outputs.version }}
          echo "### 多架构 manifest 已发布" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect --raw ${{ needs.gate.outputs.image }}:${{ steps.meta.outputs.version }} \
            | jq -r '.manifests[] | "| \(.platform.architecture) | \(.platform.os) | \(.digest) |"' \
            | { echo "| arch | os | digest |"; echo "|---|---|---|"; cat; } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时输出合并参数（诊断）
        if: failure()
        run: |
          echo "::error title=合并参数::image=${{ needs.gate.outputs.image }} | version=${{ steps.meta.outputs.version }} | tags=${{ steps.meta.outputs.tags }}"

