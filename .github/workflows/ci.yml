name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ⚠️ 镜像名**刻意不在这里定义**，也**刻意不走 job output**。两个独立原因：
  #
  # 【一】workflow 级 `env:` 取不到 `secrets` 上下文 —— 只能取到 `vars` / `github`。
  #   这是 run #2 实测踩出来的（缺陷 D-11）：原来写的是
  #   `vars.DOCKERHUB_USERNAME || github.repository_owner`，只配了 secret 没配 variable 时
  #   回退成 `LIUBANGJIAN`，buildx 直接报
  #     failed to push LIUBANGJIAN/download-gateway: ... lookup LIUBANGJIAN ...: no such host
  #
  # 【二】更隐蔽的一条（缺陷 D-12，run #3）：**由 secret 派生出来的 job output 会被
  #   GitHub 静默丢弃**。run #3 里 `gate` job 明明是 ✅，却在 run 页面留下一条 warning：
  #     Skip output 'image' since it may contain secret.
  #   于是 build 里 `format('type=image,name={0},…', needs.gate.outputs.image)` 拼出
  #   `name=`（空），buildx 的 `build/opt.go` 判定 `name == "" && push != ""`，报
  #     ERROR: failed to build: tag is needed when pushing to registry
  #   —— 一个和「tag / push-by-digest」毫无关系的谜语人报错。
  #   注意它是**按值内容**判定的：同一轮里 `publish`（字面量 "true"/"false"）能正常传递，
  #   `image`（含 secret 的值）被吞。
  #
  # 所以现在的做法：**gate 只输出布尔 `publish`；镜像名由 build / merge 各自用
  # job 级 `env:` 从 secret 现取**（同一个 job 内使用 secret 没有任何限制，
  # 所有 `docker/login-action` 都这么用）。

jobs:
  # ---------- 0) 隐私脱敏闸门（public 仓库：命中即中止）----------
  #
  # 这是第二道防线。第一道是 `.gitignore`（`doc/*.token.txt`、`design/`、
  # `.workbuddy/` 等根本不进仓库）。两层都要有：
  # 只要有人 `git add -f` 强推了本地敏感文件，这里必须拦住。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描凭据 / 内网 IP / 弱口令
        run: |
          set -uo pipefail
          # 只放**强特征**：真实 token 格式、真实私网 IP、私钥块、AWS Key、
          # 以及「用户:口令」形态的弱口令。
          #
          # 刻意**不放**「明文提及敏感文件名」（如 `xxx.token.txt`）这类启发式：
          # ① 文件名不是凭据，价值极低；
          # ② 它是**自指**的 —— 任何解释这条规则的注释、任何列出待忽略文件的
          #    `.gitignore` 都会命中它，导致闸门永远红灯（本地实测确实如此，
          #    见 commit 说明里的 D-8）。
          # 文件级策略交给 `.gitignore`（第一道防线）。
          PAT='ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|dckr_pat_[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|(admin|root|user|guest):[A-Za-z0-9@._!-]{1,16}'
          if git grep -nIE "$PAT" -- . ; then
            echo "::error::命中敏感信息，拒绝构建与推送"
            exit 1
          fi
          echo "脱敏闸门通过：未发现凭据 / 内网 IP / 弱口令"

  # ---------- 1) 质量门 ----------
  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all --locked

      # TLS 后端闸门：Docker/Linux 下 schannel 不存在，
      # 一旦有人把 reqwest 改回 native-tls，这里必须失败（02 §0 A-1 / 00 §50-51）
      - name: 闸门 · 不得引入 native-tls
        run: |
          if grep -qE '^name = "native-tls"$' Cargo.lock; then
            echo "::error::Cargo.lock 含 native-tls —— Docker/Linux 下 TLS 将不可用"
            exit 1
          fi
          echo "TLS 后端检查通过（未引入 native-tls）"

      # 这条闸门替代了原来的「明文提及敏感文件名」启发式：
      # 它检查的是**真实风险**（凭据/设计文档被 `git add -f` 强推），而不是字面串。
      - name: 闸门 · 敏感文件不得进入版本控制
        run: |
          set -uo pipefail
          bad=0
          # ⚠️ 必须用 `git ls-files -z`：不带 `-z` 时，git 会给含**非 ASCII** 的路径
          # 加引号并做八进制转义（实测输出形如 `"design/__\351\227\270..."`），
          # 于是任何 `^design/` 这类锚定匹配都会失效 —— 而本项目要防的文件名
          # 恰好几乎全是中文。这就是「闸门看着在、实际是装饰」的典型静默失效：
          # 本地用纯 ASCII 文件名测会过，换成真实中文名就漏。
          # 另：用 `< <(...)` 而不是管道，否则 while 跑在子 shell 里，`bad=1` 传不回来。
          while IFS= read -r -d '' f; do
            case "$f" in
              design/*|*/design/*|*.token.txt|doc/*服务器*.txt|doc/BitComet*.txt|.env|*/.env)
                echo "::error file=$f::敏感文件被纳入版本控制（设计文档 / 凭据 / 环境文件）"
                bad=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "版本控制内容检查通过：无设计文档 / 凭据文件 / 环境文件"

      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # T10 落地前端后自动生效；当前 web/ 尚不存在，此步会被跳过
      - name: 前端构建
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm run build

  # ---------- 2) 发布条件判定 ----------
  #
  # 为什么要有这个 job：Docker Hub 凭据是**运行期配置**，不是代码。
  # 没有它的时候，「构建并推送」这条路必然失败 —— 但那**不是代码问题**。
  # 把两者解耦后：
  #   · 有凭据 → 构建 + push-by-digest + 合并多架构 manifest；
  #   · 无凭据 → **仍然构建镜像**（验证 Dockerfile 有效），只是不登录、不推送。
  # 这样「Dockerfile 是否可用」每次推送都能被验证，而红叉只用来表示真问题。
  #
  # 注意：secrets 不能直接用在 job 级 `if:` 里，故必须用这种「小 job 导出 output」的写法。
  gate:
    needs: test
    # ⚠️ 显式写 `needs.test.result` 而不是光写 `github.event_name != ...`：
    # 一旦 job 级写了 `if:`，它就会**替换掉** GitHub 原本隐式的 `success()` 门禁，
    # 于是「上游失败也照跑」。这类静默失守本项目踩过第二次（缺陷 D-13）。
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      # ⚠️ 这里**只能**输出「不含 secret 派生」的值（缺陷 D-12）。
      # 任何由 `secrets.*` 算出来的 job output 都会被 GitHub 静默丢弃，
      # 只在 run 页面留一条 `Skip output '…' since it may contain secret.` 的 warning，
      # 消费侧拿到的是空串 —— 错误于是以「下游某个谜语人报错」的形式延迟暴露。
      # 镜像名因此**不再经过 output**，改由 build / merge 各自从 secret 现取。
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          SECRET_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VAR_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -uo pipefail

          # ---- 一、判定是否具备发布条件 ----
          # 这一步的产物只有布尔值，可以安全地作为 job output 传出去。
          if [ -n "${SECRET_USER:-}" ] && [ -n "${SECRET_TOKEN:-}" ]; then
            publish=true
            echo "Docker Hub 凭据已配置：将构建并推送多架构镜像"
          else
            publish=false
            echo "::notice title=跳过镜像发布::Docker Hub 凭据未配置。请到 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN。本次仍会构建镜像以验证 Dockerfile。"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

          # ---- 二、镜像名「校验」（注意：只校验，不做任何转换）----
          #
          # ⚠️ 这里**刻意不做 `tr '[:upper:]' '[:lower:]'`**。
          # 原因：build / merge 里的镜像名是用**表达式**直接从 secret 取的
          # （`secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || github.repository_owner`），
          # 而表达式没有 `lower()` 可用。如果这里偷偷小写化，就会出现
          # 「**校验过的值 ≠ 实际使用的值**」的静默漂移 —— 校验通过、推送照样炸。
          # 所以优先级链与取值形态必须两侧**逐字一致**；能小写化就两侧都能，不能就两侧都不。
          #
          # 于是校验口径收敛为「要求原值本身就合法」：Docker Hub 命名空间本就只允许
          # 小写字母 / 数字 / `.` `_` `-`，合法值天然满足。真有人写成大写，
          # 这里 fail fast 并直接告诉他改哪里，胜过推迟到 push 阶段才炸。
          #
          # 兜底值与 build / merge 的表达式**逐字一致**：`namespace-unset`。
          # 用占位值而不是 `github.repository_owner`，是为了让「解析出的命名空间」
          # 在**任何**路径上都是合法小写串 —— 于是下面的字符集校验可以**无条件执行**，
          # 不必再给「无凭据」开免检口子（那个口子正是 D-11 溜过去的地方：
          # 非空但非法的 `LIUBANGJIAN/...` 因为没有校验而被放过）。
          u="${SECRET_USER:-}"
          [ -n "$u" ] || u="${VAR_USER:-}"
          [ -n "$u" ] || u='namespace-unset'
          echo "镜像命名空间解析结果 = 「${u}」"

          # 字符集校验**无条件执行**：命名空间合法是本项目对镜像名的硬要求，
          # 与「本次是否推送」无关。只允许小写字母 / 数字 / `.` `_` `-`
          # （Docker Hub 命名空间本就如此；小写是硬性的，大写会被 buildx 当主机名）。
          if [ -z "$u" ] || printf '%s' "$u" | grep -q '[^a-z0-9._-]'; then
            echo "::error title=Docker Hub 命名空间非法::解析出的命名空间 = 「${u}」，只允许小写字母 / 数字 / . _ -。若这个值来自 GitHub 用户名，请改用 Docker Hub 用户名，并把 Settings → Secrets and variables → Actions 里的 DOCKERHUB_USERNAME 设成**全小写**后重跑。"
            exit 1
          fi
          echo "镜像名 = ${u}/download-gateway（合法）"
          if [ "$publish" = "true" ]; then
            echo "具备发布条件：将构建并推送多架构镜像。"
          else
            echo "未具备发布条件：本次只构建镜像验证 Dockerfile，不推送。"
          fi

  # ---------- 3) 原生矩阵构建（amd64/arm64 各自原生，避 QEMU）----------
  #
  # 不用 QEMU 的原因（02 §5.2）：Rust 全量编译在仿真下要 40–90 分钟，
  # 而 ubuntu-24.04-arm 是原生 arm64 Runner，每格 5–8 分钟。
  build:
    needs: [test, gate]
    # 不把 `needs.gate.result == 'success'` 写进来：gate 未过只意味着「不该推送」，
    # 而既定策略是**每次推送都构建一遍镜像**（验证 Dockerfile 每一层都成立），
    # 无凭据 / gate 未过只让推送降级，不让构建降级。上游 test 失败才该整体跳过。
    # 注意：job 级 `if:` 会**替换掉** GitHub 隐式的 `success()` 门禁，
    # 所以必须自己把 `needs.test.result` 写全（缺陷 D-13）。
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' }}
    # ⚠️ 镜像名放在 **job 级 env**，而不是 job output：
    # ① 同一个 job 内使用 secret 不受 D-12 那条限制（所有 `docker/login-action` 都这么用）；
    # ② workflow 级 `env:` 取不到 `secrets` 上下文（D-11），只能写在这一层；
    # ③ 刻意**不用 step output 中转**：那会引入「runner 是否也会过滤派生自 secret 的
    #    step output」这个未经验证的假设。env 是唯一有确定行为的通道。
    # 优先级链必须与 `gate` 里那段 shell **逐字一致**（见 gate 的注释）。
    env:
      # ⚠️ 兜底值**刻意不用** `github.repository_owner`：GitHub 用户名可能含**大写**，
      # 而 buildx 会把首段含大写的名字当成 **registry 主机名**去 DNS 解析
      # （现场报错：`lookup LIUBANGJIAN …: no such host`）—— 那就是缺陷 D-11。
      # 改用中性占位 `namespace-unset`：它永远是一个**合法的小写命名空间**，
      # 因此「无凭据」这条路径不会给构建带来红叉，也不可能被误当主机名；
      # 而真正的发布路径由 gate 的 publish 把关，占位值永远推不出去。
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'namespace-unset' }}/download-gateway
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # fail fast：把「镜像名有没有拿到」变成**立刻可见、且明确指出原因**的失败，
      # 而不是等 buildx 丢一句谜语（D-12 的教训）：
      #   ERROR: failed to build: tag is needed when pushing to registry
      # 那句来自 buildx `build/opt.go` 的 toSolveOpt()：
      #   if e.Type == "image" && e.Attrs["name"] == "" && e.Attrs["push"] != "" { ... }
      # —— 判据就是「导出器叫 image、push 为真、但 name 是空串」，仅此一条。
      # （上一版注释把它记成了 prepareMultiDriverExports，那是多驱动路径的同类检查，
      #   与单节点 buildx 无关，已纠正。）
      - name: 自检 · 构建参数
        run: |
          set -uo pipefail
          case "${IMAGE:-}" in
            ""|"/download-gateway")
              echo "::error title=镜像名解析失败::IMAGE=「${IMAGE:-}」为空。请检查 Settings → Secrets and variables → Actions 里的 DOCKERHUB_USERNAME（或 DOCKERHUB_USERNAME 仓库变量）。"
              exit 1
              ;;
          esac
          # ⚠️ 必须校验**字符集**，不能只判空。历史现场：
          #   IMAGE: LIUBANGJIAN/download-gateway      ← 非空，但非法（大写）
          # 判空会放它过去，buildx 随后把它当 registry 主机名，
          # 报出与真实原因毫不相干的 `lookup LIUBANGJIAN …: no such host`。
          # 判据与 gate 那条**必须一致**，两侧不得各自演化。
          ns="${IMAGE%/download-gateway}"
          if printf '%s' "$ns" | grep -q '[^a-z0-9._-]'; then
            echo "::error title=镜像命名空间非法::IMAGE=「${IMAGE}」的命名空间部分是「${ns}」，只允许小写字母 / 数字 / . _ -。Docker Hub 命名空间强制全小写；若你只依赖 GitHub 用户名兜底，请显式配置 DOCKERHUB_USERNAME。"
            exit 1
          fi
          if [ "$ns" = "namespace-unset" ]; then
            echo "::warning title=未配置 Docker Hub 用户名::镜像名使用了占位命名空间 namespace-unset，本次不会推送镜像（仅验证 Dockerfile）。"
          fi
          echo "镜像名已解析：${IMAGE}（该值派生自 secret，GitHub 在日志里会打码成 *** —— 属于预期）"
          {
            echo "### 构建参数 · ${{ matrix.platform }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像名 | \`${IMAGE}\` |"
            echo "| publish | \`${{ needs.gate.outputs.publish }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 登录 Docker Hub（仅发布时需要）
        if: needs.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: 构建镜像${{ needs.gate.outputs.publish == 'true' && '并推送' || '（仅验证，不推送）' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # 推送由 outputs 里的 `push=true` 控制 —— push-by-digest 必须用 `outputs` 形式，
          # 不能用 `push:` 快捷写法（那会退化成普通 tag 推送，拿不到逐架构 digest）。
          # 无凭据时 outputs 为空 ⇒ 只构建进 buildx 缓存（**Dockerfile 每一层仍被完整验证**）。
          outputs: ${{ needs.gate.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}

      # 把关键取值变成**公开可读的错误注解**。
      # 原因：Actions 作业日志通过 API 拉取需要管理员权限（未认证返回 403
      # "Must have admin rights to Repository"），而失败步骤的错误注解是公开可读的。
      # 失败时把构建参数塞进 ::error::，排障就不必依赖日志。
      - name: 失败时输出构建参数（诊断）
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "::error title=构建参数::image=${{ env.IMAGE }} | publish=${{ needs.gate.outputs.publish }} | outputs=${{ needs.gate.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '<空>' }}"

      - name: 收集 digest
        if: needs.gate.outputs.publish == 'true' && steps.build.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: needs.gate.outputs.publish == 'true' && steps.build.outcome == 'success'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ---------- 4) 合并为多架构 manifest ----------
  merge:
    needs: [build, gate]
    # 三个条件都要**显式**写：job 级 `if:` 会替换掉 GitHub 隐式的 `success()`（缺陷 D-13），
    # 而这里既要求「有凭据」也要求「两个架构都真的构建成功」，
    # 否则会用残缺的 digest 集合并出一个少架构的 manifest —— 那种错最难看：CI 全绿，镜像却是残的。
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.gate.outputs.publish == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # 同 build：镜像名走 job 级 env，不走 job output（缺陷 D-12）。
    # 优先级链与 gate / build **逐字一致**（含兜底值）。
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'namespace-unset' }}/download-gateway
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      # 自检：digest 集合必须**恰好两个**。少一个就会合出残缺 manifest，
      # 多一个说明矩阵被改过而这里没同步 —— 两种都该立刻停下。
      - name: 自检 · digest 数量
        working-directory: /tmp/digests
        run: |
          set -uo pipefail
          n=$(ls -1 | wc -l | tr -d ' ')
          echo "收到 $n 个 digest：$(ls -1 | tr '\n' ' ')"
          if [ "$n" -ne 2 ]; then
            echo "::error title=digest 数量异常::期望 2 个（amd64 + arm64），实际 ${n} 个。拒绝合并出残缺 manifest。"
            exit 1
          fi
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -uo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags|map("-t "+.)|join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Verify manifest
        run: |
          set -uo pipefail
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
          echo "### 多架构 manifest 已发布" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect --raw "${IMAGE}:${{ steps.meta.outputs.version }}" \
            | jq -r '.manifests[] | "| \(.platform.architecture) | \(.platform.os) | \(.digest) |"' \
            | { echo "| arch | os | digest |"; echo "|---|---|---|"; cat; } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时输出合并参数（诊断）
        if: failure()
        run: |
          echo "::error title=合并参数::image=${IMAGE} | version=${{ steps.meta.outputs.version }} | tags=${{ steps.meta.outputs.tags }}"

