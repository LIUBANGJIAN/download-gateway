name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ⚠️ 镜像名**刻意不在这里定义**，也**刻意不走 job output**。两个独立原因：
  #
  # 【一】workflow 级 `env:` 取不到 `secrets` 上下文 —— 只能取到 `vars` / `github`。
  #   这是 run #2 实测踩出来的（缺陷 D-11）：原来写的是
  #   `vars.DOCKERHUB_USERNAME || github.repository_owner`，只配了 secret 没配 variable 时
  #   回退成 `LIUBANGJIAN`，buildx 直接报
  #     failed to push LIUBANGJIAN/download-gateway: ... lookup LIUBANGJIAN ...: no such host
  #
  # 【二】更隐蔽的一条（缺陷 D-12，run #3）：**由 secret 派生出来的 job output 会被
  #   GitHub 静默丢弃**。run #3 里 `gate` job 明明是 ✅，却在 run 页面留下一条 warning：
  #     Skip output 'image' since it may contain secret.
  #   于是 build 里 `format('type=image,name={0},…', needs.gate.outputs.image)` 拼出
  #   `name=`（空），buildx 的 `build/opt.go` 判定 `name == "" && push != ""`，报
  #     ERROR: failed to build: tag is needed when pushing to registry
  #   —— 一个和「tag / push-by-digest」毫无关系的谜语人报错。
  #   注意它是**按值内容**判定的：同一轮里 `publish`（字面量 "true"/"false"）能正常传递，
  #   `image`（含 secret 的值）被吞。
  #
  # 所以现在的做法：**gate 只输出布尔 `publish`；镜像名由 build / merge 各自用
  # job 级 `env:` 从 secret 现取**（同一个 job 内使用 secret 没有任何限制，
  # 所有 `docker/login-action` 都这么用）。

jobs:
  # ---------- 0) 隐私脱敏闸门（public 仓库：命中即中止）----------
  #
  # 这是第二道防线。第一道是 `.gitignore`（`doc/*.token.txt`、`design/`、
  # `.workbuddy/` 等根本不进仓库）。两层都要有：
  # 只要有人 `git add -f` 强推了本地敏感文件，这里必须拦住。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描凭据 / 内网 IP / 弱口令
        run: |
          set -uo pipefail
          # 只放**强特征**：真实 token 格式、真实私网 IP、私钥块、AWS Key、
          # 以及「用户:口令」形态的弱口令。
          #
          # 刻意**不放**「明文提及敏感文件名」（如 `xxx.token.txt`）这类启发式：
          # ① 文件名不是凭据，价值极低；
          # ② 它是**自指**的 —— 任何解释这条规则的注释、任何列出待忽略文件的
          #    `.gitignore` 都会命中它，导致闸门永远红灯（本地实测确实如此，
          #    见 commit 说明里的 D-8）。
          # 文件级策略交给 `.gitignore`（第一道防线）。
          PAT='ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|dckr_pat_[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|(admin|root|user|guest):[A-Za-z0-9@._!-]{1,16}'
          if git grep -nIE "$PAT" -- . ; then
            echo "::error::命中敏感信息，拒绝构建与推送"
            exit 1
          fi
          echo "脱敏闸门通过：未发现凭据 / 内网 IP / 弱口令"

  # ---------- 1) 质量门 ----------
  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      # ⚠️ 必须带 `--workspace`。这里踩过一次坑：原先只写
      # `cargo clippy --all-targets --all-features`，而 **`--all-targets` 不是
      # `--all`** —— 前者指「lib/bins/tests/benches/examples 全部目标种类」，
      # 后者才是「全部 workspace 成员」。根 Cargo.toml 同时是 workspace 根、
      # 又含 `[package]`（**非虚拟清单**），故不带 `--workspace` 时 cargo 默认
      # **只选根包 `download-gateway`**；`crates/dispatch-core` 与
      # `crates/bitcomet-api` **从未被 clippy 检查过**。
      # 后果实证：`src/admin/policy.rs` 里一条 `clippy::bool_assert_comparison`
      # 就这么一路绿着进了 main（同作业的 `fmt --all` 与 `test --all` 用的都是
      # `--all` = workspace，反而是 clippy 这条漏了）。
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all --locked

      # TLS 后端闸门：Docker/Linux 下 schannel 不存在，
      # 一旦有人把 reqwest 改回 native-tls，这里必须失败（02 §0 A-1 / 00 §50-51）
      - name: 闸门 · 不得引入 native-tls
        run: |
          if grep -qE '^name = "native-tls"$' Cargo.lock; then
            echo "::error::Cargo.lock 含 native-tls —— Docker/Linux 下 TLS 将不可用"
            exit 1
          fi
          echo "TLS 后端检查通过（未引入 native-tls）"

      # 这条闸门替代了原来的「明文提及敏感文件名」启发式：
      # 它检查的是**真实风险**（凭据/设计文档被 `git add -f` 强推），而不是字面串。
      - name: 闸门 · 敏感文件不得进入版本控制
        run: |
          set -uo pipefail
          bad=0
          # ⚠️ 必须用 `git ls-files -z`：不带 `-z` 时，git 会给含**非 ASCII** 的路径
          # 加引号并做八进制转义（实测输出形如 `"design/__\351\227\270..."`），
          # 于是任何 `^design/` 这类锚定匹配都会失效 —— 而本项目要防的文件名
          # 恰好几乎全是中文。这就是「闸门看着在、实际是装饰」的典型静默失效：
          # 本地用纯 ASCII 文件名测会过，换成真实中文名就漏。
          # 另：用 `< <(...)` 而不是管道，否则 while 跑在子 shell 里，`bad=1` 传不回来。
          while IFS= read -r -d '' f; do
            case "$f" in
              design/*|*/design/*|*.token.txt|doc/*服务器*.txt|doc/BitComet*.txt|.env|*/.env)
                echo "::error file=$f::敏感文件被纳入版本控制（设计文档 / 凭据 / 环境文件）"
                bad=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "版本控制内容检查通过：无设计文档 / 凭据文件 / 环境文件"

      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # T10 落地前端后自动生效；当前 web/ 尚不存在，此步会被跳过
      - name: 前端构建
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm run build

  # ---------- 2) 发布条件判定 ----------
  #
  # 为什么要有这个 job：Docker Hub 凭据是**运行期配置**，不是代码。
  # 没有它的时候，「构建并推送」这条路必然失败 —— 但那**不是代码问题**。
  # 把两者解耦后：
  #   · 有凭据 → 构建 + push-by-digest + 合并多架构 manifest；
  #   · 无凭据 → **仍然构建镜像**（验证 Dockerfile 有效），只是不登录、不推送。
  # 这样「Dockerfile 是否可用」每次推送都能被验证，而红叉只用来表示真问题。
  #
  # 注意：secrets 不能直接用在 job 级 `if:` 里，故必须用这种「小 job 导出 output」的写法。
  gate:
    needs: test
    # ⚠️ 显式写 `needs.test.result` 而不是光写 `github.event_name != ...`：
    # 一旦 job 级写了 `if:`，它就会**替换掉** GitHub 原本隐式的 `success()` 门禁，
    # 于是「上游失败也照跑」。这类静默失守本项目踩过第二次（缺陷 D-13）。
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      # ⚠️ 这里**只能**输出「不含 secret 派生」的值（缺陷 D-12）。
      # 任何由 `secrets.*` 算出来的 job output 都会被 GitHub 静默丢弃，
      # 只在 run 页面留一条 `Skip output '…' since it may contain secret.` 的 warning，
      # 消费侧拿到的是空串 —— 错误于是以「下游某个谜语人报错」的形式延迟暴露。
      # 镜像名因此**不再经过 output**，改由 build / merge 各自从 secret 现取。
      publish: ${{ steps.check.outputs.publish }}
      # 版本号**不是** secret 派生的，可以安全作为 job output（D-12 只吞 secret 派生值）。
      app_version: ${{ steps.ver.outputs.app_version }}
    steps:
      # fetch-depth: 0 是**必须**的：默认 depth=1 拿不到 tag 也拿不到提交历史，
      # `git describe` / `git rev-list --count` 会直接失效。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        run: |
          set -uo pipefail
          BASE="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            # ⚠️ **刻意不做静默兜底**（红队审查 F3）。原实现是打一条 `::warning` 然后退回 `0.1.0`。
            # 为什么那是个陷阱：build 注入的版本与冒烟断言的期望版本**同出一个来源**，
            # 兜底一旦生效，两侧会一起退成 `0.1.0` ⇒ 「容器自报 == 期望」三条全等 ⇒
            # **CI 全绿，而版本号是错的**。也就是说，那条断言只能证明"注入链没断"，
            # 永远证不了"版本算得对"；兜底就等于把这个盲区主动打开。
            # 本仓库确证存在 `v0.1.0`，所以 `git describe` 失败只可能意味着
            # **checkout 坏了**（fetch-depth 退化、或 tag 没推上来）—— 这种故障必须红。
            echo "::error title=版本号无法计算::checkout 里找不到任何 semver tag（如 v0.1.0）。请查本步骤的 fetch-depth 是否为 0、以及 tag 是否已 push 到远端。刻意不做静默兜底：兜底会让版本号悄悄退成 0.1.0，而下游断言因两侧同源照样全绿。"
            exit 1
          fi
          BASE_NUM="${BASE#v}"
          MAJ="${BASE_NUM%%.*}"
          REST="${BASE_NUM#*.}"
          MIN="${REST%%.*}"
          PAT="${REST#*.}"
          [ "$PAT" = "$REST" ] && PAT=0
          N="$(git rev-list --count "${BASE}..HEAD")"
          echo "app_version=${MAJ}.${MIN}.$((PAT + N))" >> "$GITHUB_OUTPUT"
          echo "基准 tag=${BASE} 之后提交数=${N} ⇒ ${MAJ}.${MIN}.$((PAT + N))"
      - id: check
        env:
          SECRET_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VAR_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -uo pipefail

          # ---- 一、判定是否具备发布条件 ----
          # 这一步的产物只有布尔值，可以安全地作为 job output 传出去。
          if [ -n "${SECRET_USER:-}" ] && [ -n "${SECRET_TOKEN:-}" ]; then
            publish=true
            echo "Docker Hub 凭据已配置：将构建并推送多架构镜像"
          else
            publish=false
            echo "::notice title=跳过镜像发布::Docker Hub 凭据未配置。请到 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN。本次仍会构建镜像以验证 Dockerfile。"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

          # ---- 二、镜像名「校验」（注意：只校验，不做任何转换）----
          #
          # ⚠️ 这里**刻意不做 `tr '[:upper:]' '[:lower:]'`**。
          # 原因：build / merge 里的镜像名是用**表达式**直接从 secret 取的
          # （`secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || github.repository_owner`），
          # 而表达式没有 `lower()` 可用。如果这里偷偷小写化，就会出现
          # 「**校验过的值 ≠ 实际使用的值**」的静默漂移 —— 校验通过、推送照样炸。
          # 所以优先级链与取值形态必须两侧**逐字一致**；能小写化就两侧都能，不能就两侧都不。
          #
          # 于是校验口径收敛为「要求原值本身就合法」：Docker Hub 命名空间本就只允许
          # 小写字母 / 数字 / `.` `_` `-`，合法值天然满足。真有人写成大写，
          # 这里 fail fast 并直接告诉他改哪里，胜过推迟到 push 阶段才炸。
          #
          # 兜底值与 build / merge 的表达式**逐字一致**：`namespace-unset`。
          # 用占位值而不是 `github.repository_owner`，是为了让「解析出的命名空间」
          # 在**任何**路径上都是合法小写串 —— 于是下面的字符集校验可以**无条件执行**，
          # 不必再给「无凭据」开免检口子（那个口子正是 D-11 溜过去的地方：
          # 非空但非法的 `LIUBANGJIAN/...` 因为没有校验而被放过）。
          u="${SECRET_USER:-}"
          [ -n "$u" ] || u="${VAR_USER:-}"
          [ -n "$u" ] || u='namespace-unset'
          echo "镜像命名空间解析结果 = 「${u}」"

          # 字符集校验**无条件执行**：命名空间合法是本项目对镜像名的硬要求，
          # 与「本次是否推送」无关。只允许小写字母 / 数字 / `.` `_` `-`
          # （Docker Hub 命名空间本就如此；小写是硬性的，大写会被 buildx 当主机名）。
          if [ -z "$u" ] || printf '%s' "$u" | grep -q '[^a-z0-9._-]'; then
            echo "::error title=Docker Hub 命名空间非法::解析出的命名空间 = 「${u}」，只允许小写字母 / 数字 / . _ -。若这个值来自 GitHub 用户名，请改用 Docker Hub 用户名，并把 Settings → Secrets and variables → Actions 里的 DOCKERHUB_USERNAME 设成**全小写**后重跑。"
            exit 1
          fi
          echo "镜像名 = ${u}/download-gateway（合法）"
          if [ "$publish" = "true" ]; then
            echo "具备发布条件：将构建并推送多架构镜像。"
          else
            echo "未具备发布条件：本次只构建镜像验证 Dockerfile，不推送。"
          fi

  # ---------- 3) 原生矩阵构建（amd64/arm64 各自原生，避 QEMU）----------
  #
  # 不用 QEMU 的原因（02 §5.2）：Rust 全量编译在仿真下要 40–90 分钟，
  # 而 ubuntu-24.04-arm 是原生 arm64 Runner，每格 5–8 分钟。
  build:
    needs: [test, gate]
    # 不把 `needs.gate.result == 'success'` 写进来：gate 未过只意味着「不该推送」，
    # 而既定策略是**每次推送都构建一遍镜像**（验证 Dockerfile 每一层都成立），
    # 无凭据 / gate 未过只让推送降级，不让构建降级。上游 test 失败才该整体跳过。
    # 注意：job 级 `if:` 会**替换掉** GitHub 隐式的 `success()` 门禁，
    # 所以必须自己把 `needs.test.result` 写全（缺陷 D-13）。
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' }}
    # ⚠️ 镜像名放在 **job 级 env**，而不是 job output：
    # ① 同一个 job 内使用 secret 不受 D-12 那条限制（所有 `docker/login-action` 都这么用）；
    # ② workflow 级 `env:` 取不到 `secrets` 上下文（D-11），只能写在这一层；
    # ③ 刻意**不用 step output 中转**：那会引入「runner 是否也会过滤派生自 secret 的
    #    step output」这个未经验证的假设。env 是唯一有确定行为的通道。
    # 优先级链必须与 `gate` 里那段 shell **逐字一致**（见 gate 的注释）。
    env:
      # ⚠️ 兜底值**刻意不用** `github.repository_owner`：GitHub 用户名可能含**大写**，
      # 而 buildx 会把首段含大写的名字当成 **registry 主机名**去 DNS 解析
      # （现场报错：`lookup LIUBANGJIAN …: no such host`）—— 那就是缺陷 D-11。
      # 改用中性占位 `namespace-unset`：它永远是一个**合法的小写命名空间**，
      # 因此「无凭据」这条路径不会给构建带来红叉，也不可能被误当主机名；
      # 而真正的发布路径由 gate 的 publish 把关，占位值永远推不出去。
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'namespace-unset' }}/download-gateway
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # fail fast：把「镜像名有没有拿到」变成**立刻可见、且明确指出原因**的失败，
      # 而不是等 buildx 丢一句谜语（D-12 的教训）：
      #   ERROR: failed to build: tag is needed when pushing to registry
      # 那句来自 buildx `build/opt.go` 的 toSolveOpt()：
      #   if e.Type == "image" && e.Attrs["name"] == "" && e.Attrs["push"] != "" { ... }
      # —— 判据就是「导出器叫 image、push 为真、但 name 是空串」，仅此一条。
      # （上一版注释把它记成了 prepareMultiDriverExports，那是多驱动路径的同类检查，
      #   与单节点 buildx 无关，已纠正。）
      - name: 自检 · 构建参数
        run: |
          set -uo pipefail
          case "${IMAGE:-}" in
            ""|"/download-gateway")
              echo "::error title=镜像名解析失败::IMAGE=「${IMAGE:-}」为空。请检查 Settings → Secrets and variables → Actions 里的 DOCKERHUB_USERNAME（或 DOCKERHUB_USERNAME 仓库变量）。"
              exit 1
              ;;
          esac
          # ⚠️ 必须校验**字符集**，不能只判空。历史现场：
          #   IMAGE: LIUBANGJIAN/download-gateway      ← 非空，但非法（大写）
          # 判空会放它过去，buildx 随后把它当 registry 主机名，
          # 报出与真实原因毫不相干的 `lookup LIUBANGJIAN …: no such host`。
          # 判据与 gate 那条**必须一致**，两侧不得各自演化。
          ns="${IMAGE%/download-gateway}"
          if printf '%s' "$ns" | grep -q '[^a-z0-9._-]'; then
            echo "::error title=镜像命名空间非法::IMAGE=「${IMAGE}」的命名空间部分是「${ns}」，只允许小写字母 / 数字 / . _ -。Docker Hub 命名空间强制全小写；若你只依赖 GitHub 用户名兜底，请显式配置 DOCKERHUB_USERNAME。"
            exit 1
          fi
          if [ "$ns" = "namespace-unset" ]; then
            echo "::warning title=未配置 Docker Hub 用户名::镜像名使用了占位命名空间 namespace-unset，本次不会推送镜像（仅验证 Dockerfile）。"
          fi
          echo "镜像名已解析：${IMAGE}（该值派生自 secret，GitHub 在日志里会打码成 *** —— 属于预期）"
          {
            echo "### 构建参数 · ${{ matrix.platform }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像名 | \`${IMAGE}\` |"
            echo "| publish | \`${{ needs.gate.outputs.publish }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 登录 Docker Hub（仅发布时需要）
        if: needs.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # ⚠️ 这段 tags **不是为了打标签**（本步骤的推送走 `outputs: push-by-digest`，
          # tags 根本不参与推送），而是为了**喂 `version` 输出**。
          #
          # 背景（红队审查发现，是一处静默错误）：metadata-action 会由 tags 推导出
          # 默认标签 `org.opencontainers.image.version`；而**默认** tags 里含
          # `type=ref,event=branch` ⇒ main 分支上推出的是 **`main`**。
          # 下面 `labels: ${{ steps.meta.outputs.labels }}` 会把它以 `--label` 交给 buildx，
          # 而**命令行的 `--label` 会盖掉 Dockerfile 里的同名 `LABEL`** ——
          # 于是 Dockerfile 里那条 `LABEL ... ${APP_VERSION}` 白写了，
          # `docker inspect` 看到的是 `main`，而 README 承诺的是版本号。
          # 更糟的是：CI 对这一点**没有任何断言**，所以它会一直绿着。
          #
          # —— 以上不是推理，是**实测**（2026-09-30）。同一仓库三个 tag 的镜像 config 里
          # `org.opencontainers.image.version` 的实际取值：
          #     v0.1.0（tag push，修复前）  = `v0.1.0`   ← tag 名
          #     v0.1.1（main push，修复前） = `main`     ← 分支名，缺陷实锤
          #     v0.1.2（main push，修复后） = `0.1.2`    ← 修复生效
          # 复核办法（无需 docker、无需 token，直接问 registry）：
          #   取匿名 token → 拉 index manifest → 取平台 manifest → 拉 config blob
          #   → 读 `.config.Labels["org.opencontainers.image.version"]`
          # 权威实现的出处：metadata-action 的 `src/tag.ts` 里 `Transform()` 的兜底 ——
          #   `if (r.length == 0) { r = [type=schedule, type=ref,event=branch, tag, pr] }`
          #   ⚠️ 它**不在** `src/meta.ts` 里；且源码写成 `` `type=ref,event=${Ref.Branch}` ``，
          #   用字面量 `grep "type=ref,event=branch"` 会 0 命中 —— **别据此断言"不存在"**。
          # buildx 侧的落点：buildkit `frontend/dockerfile/dockerfile2llb/convert.go` 的
          #   `finalizeResultImage()`：`maps.Copy(target.image.Config.Labels, dctx.opt.Labels)`
          #   —— 命令行 `--label` 覆盖 Dockerfile `LABEL`，且发生在收尾阶段，**永远赢**；
          #   build-push-action 侧就是 `args.push('--label', label)`。
          #
          # 修法刻意选「根上不产生冲突」，而不是「用自定义 label 覆盖默认 label」——
          # 后者依赖 label 的先后顺序（谁覆盖谁取决于 metadata-action 内部顺序，
          # 且 buildx 取最后一个），本机无法验证，属于脆弱假设。
          # 这里给出**唯一**的 raw tag，推导出的版本就只可能等于本次版本。
          tags: |
            type=raw,value=${{ needs.gate.outputs.app_version }}

      - name: 构建镜像${{ needs.gate.outputs.publish == 'true' && '并推送' || '（仅验证，不推送）' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # 推送由 outputs 里的 `push=true` 控制 —— push-by-digest 必须用 `outputs` 形式，
          # 不能用 `push:` 快捷写法（那会退化成普通 tag 推送，拿不到逐架构 digest）。
          # 无凭据时 outputs 为空 ⇒ 只构建进 buildx 缓存（**Dockerfile 每一层仍被完整验证**）。
          outputs: ${{ needs.gate.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # 版本号在**编译期**注入二进制（见 Dockerfile 的 ARG/ENV 与
          # crates/dispatch-core/src/lib.rs 的 option_env!）。缺了它会退化成
          # `0.0.0-unknown`，冒烟断言会因此红 —— 属于刻意可见的失败。
          build-args: |
            APP_VERSION=${{ needs.gate.outputs.app_version }}

      # 把关键取值变成**公开可读的错误注解**。
      # 原因：Actions 作业日志通过 API 拉取需要管理员权限（未认证返回 403
      # "Must have admin rights to Repository"），而失败步骤的错误注解是公开可读的。
      # 失败时把构建参数塞进 ::error::，排障就不必依赖日志。
      - name: 失败时输出构建参数（诊断）
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "::error title=构建参数::image=${{ env.IMAGE }} | publish=${{ needs.gate.outputs.publish }} | outputs=${{ needs.gate.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '<空>' }}"

      - name: 收集 digest
        if: needs.gate.outputs.publish == 'true' && steps.build.outcome == 'success'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: needs.gate.outputs.publish == 'true' && steps.build.outcome == 'success'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ---------- 4) 合并为多架构 manifest ----------
  merge:
    needs: [build, gate]
    # 三个条件都要**显式**写：job 级 `if:` 会替换掉 GitHub 隐式的 `success()`（缺陷 D-13），
    # 而这里既要求「有凭据」也要求「两个架构都真的构建成功」，
    # 否则会用残缺的 digest 集合并出一个少架构的 manifest —— 那种错最难看：CI 全绿，镜像却是残的。
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.gate.outputs.publish == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # 同 build：镜像名走 job 级 env，不走 job output（缺陷 D-12）。
    # 优先级链与 gate / build **逐字一致**（含兜底值）。
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'namespace-unset' }}/download-gateway
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            # 每次提交自动 +1 的版本号（见 gate 的 ver 步骤）。人类读的那一个。
            # merge 的 job 级 `if:` 已排除 PR（`github.event_name != 'pull_request'`），
            # 故这里**不需要** `enable` 条件 —— 能走到这一步的一定是 main push 或 tag。
            type=raw,value=v${{ needs.gate.outputs.app_version }}
            type=raw,value=${{ needs.gate.outputs.app_version }}
            # ⚠️ `format=short` 必须**显式写出来**，不能靠默认值。
            # 下游 smoke 作业按 `${GITHUB_SHA:0:7}` 拼出同一个 tag，用来精确拉取本次产物。
            # 两个"7"是**隐式耦合**：它们之所以相等，只因为两侧都**没有**设
            # `DOCKER_METADATA_SHORT_SHA_LENGTH`（metadata-action 的短 SHA 默认长度恰为 7，
            # 且 push 事件下 `GITHUB_SHA` 就是本次提交 SHA，小写十六进制）。
            # 若有人把这个变量设成别的值（比如 12），tag 就会漂移，表现是：smoke 拉取失败 →
            # 回退成本地重建。**关键不是"静默"** —— 回退会打 `::warning`，但**红绿结果不变**：
            # 脚本照跑照绿。所以真正要防的失守是「**验的对象被悄悄换掉了，而 CI 仍然是绿的**」。
            # 显式写出来，至少让这个耦合点是明文的。
            type=sha,prefix=sha-,format=short
      # 自检：digest 集合必须**恰好两个**。少一个就会合出残缺 manifest，
      # 多一个说明矩阵被改过而这里没同步 —— 两种都该立刻停下。
      - name: 自检 · digest 数量
        working-directory: /tmp/digests
        run: |
          set -uo pipefail
          n=$(ls -1 | wc -l | tr -d ' ')
          echo "收到 $n 个 digest：$(ls -1 | tr '\n' ' ')"
          if [ "$n" -ne 2 ]; then
            echo "::error title=digest 数量异常::期望 2 个（amd64 + arm64），实际 ${n} 个。拒绝合并出残缺 manifest。"
            exit 1
          fi
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -uo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags|map("-t "+.)|join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Verify manifest
        run: |
          set -uo pipefail
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
          echo "### 多架构 manifest 已发布" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect --raw "${IMAGE}:${{ steps.meta.outputs.version }}" \
            | jq -r '.manifests[] | "| \(.platform.architecture) | \(.platform.os) | \(.digest) |"' \
            | { echo "| arch | os | digest |"; echo "|---|---|---|"; cat; } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时输出合并参数（诊断）
        if: failure()
        run: |
          echo "::error title=合并参数::image=${IMAGE} | version=${{ steps.meta.outputs.version }} | tags=${{ steps.meta.outputs.tags }}"

  # ---------- 5) 容器冒烟：把刚构建的镜像**真跑起来** ----------
  #
  # 为什么非要这一层：在这之前，整条流水线只**构建**镜像、从不**运行**镜像。
  # 于是「Dockerfile 的 ENTRYPOINT 写错了」「迁移没打进镜像」「路由没挂上」
  # 这三类问题，在 CI 里全都是绿的 —— 镜像照样推上 Docker Hub，用户拉下来才是坏的。
  # 这叫「假绿」：绿灯证明的是「编译过了」，不是「这东西能跑」。
  #
  # 本作业把镜像真启动，然后逐个面去打接口：健康检查 / aria2 原生协议面 /
  # BitComet 原生协议面的认证门禁 / 管理口登录与只读接口 / 节点增删改与密码回看 /
  # 策略保存与校验 / **管理台不得能提交任务**。断言明细见 `.github/scripts/smoke.sh`。
  #
  # 两个刻意的设计取舍：
  #  ① **优先拉取本次发布的镜像**（`sha-<短短 sha>`），而不是本地重造、更不是 `latest`。
  #     验 `latest` 等于验上一版，那种绿毫无意义。若拉取失败（例如本次未发布），
  #     才回退成「用同一份源码本地构建」——结论仍指向本次提交，但会打 warning。
  #  ② 镜像名继续走 **job 级 env**（而非 job output）：见文件开头 D-12 的教训。
  smoke:
    # ⚠️ 必须**显式**依赖 merge：否则冒烟可能跑在 manifest 合并之前，
    # 去拉一个还不存在的 tag。所有 `needs` 都写全，是因为下面 job 级 `if:`
    # 会替换掉 GitHub 隐式的 `success()` 门禁（缺陷 D-13）。
    needs: [test, gate, build, merge]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # 兜底超时：真出问题时不想让它挂到 GitHub 默认的 6 小时。
    timeout-minutes: 30
    env:
      # 优先级链与 gate / build / merge **逐字一致**（含兜底值）。
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'namespace-unset' }}/download-gateway
    steps:
      - uses: actions/checkout@v4

      # 登录只为避开 Docker Hub 的**匿名拉取限流**（本仓库镜像目前是 public，
      # 不登录也能拉）。没有凭据时不登录，拉取走匿名 —— 失败会走本地构建回退。
      - name: 登录 Docker Hub（仅发布时需要）
        if: needs.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 解析本次镜像引用
        id: resolve
        env:
          PUBLISH: ${{ needs.gate.outputs.publish }}
          # 回退到本地构建时也要把版本号传进去（否则镜像自报 0.0.0-unknown，冒烟断言会红）。
          EXPECT_VERSION: ${{ needs.gate.outputs.app_version }}
        run: |
          set -uo pipefail
          # 与 merge 里 `type=sha,prefix=sha-,format=short` 拼法必须一致（见那边的注释）。
          TAG="sha-${GITHUB_SHA:0:7}"
          if [ "${PUBLISH:-false}" = "true" ]; then
            echo "本次应已发布镜像：${IMAGE}:${TAG}"
            if docker pull "${IMAGE}:${TAG}"; then
              echo "ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
              echo "mode=registry" >> "$GITHUB_OUTPUT"
              echo "已从 registry 拉回本次构建的镜像，开始冒烟。"
              exit 0
            fi
            echo "::warning title=回退本地构建::拉取 ${IMAGE}:${TAG} 失败，无法确认 registry 上的本次产物。改为用**同一份源码**本地构建镜像做冒烟 —— 结论仍指向本次提交，但验的不再是发布出去的那一枚。"
          else
            echo "::notice title=未配置 Docker Hub 凭据::本次没有已发布镜像可用，改为本地构建源码镜像做冒烟（不推送）。"
          fi
          docker build --build-arg APP_VERSION="${EXPECT_VERSION:-0.0.0-unknown}" -t smoke-local:ci .
          echo "ref=smoke-local:ci" >> "$GITHUB_OUTPUT"
          echo "mode=local" >> "$GITHUB_OUTPUT"

      - name: 容器冒烟
        env:
          IMAGE: ${{ steps.resolve.outputs.ref }}
          # 传给 smoke.sh：容器内 /healthz 自报版本必须与本次提交期望版本逐字相等。
          EXPECT_VERSION: ${{ needs.gate.outputs.app_version }}
        run: bash .github/scripts/smoke.sh

      # 与 build / merge 同样的诊断策略：Actions 作业日志通过 API 拉取要管理员权限，
      # 而错误注解是公开可读的。失败时把关键取值塞进 ::error::，排障不必依赖日志。
      - name: 失败时输出冒烟参数（诊断）
        if: failure()
        run: |
          echo "::error title=冒烟参数::image=${{ steps.resolve.outputs.ref }} | mode=${{ steps.resolve.outputs.mode }} | publish=${{ needs.gate.outputs.publish }}"
          echo "--- 容器状态 ---"
          docker ps -a --filter name=gw-smoke --format '{{.Status}}' || true
          echo "--- 容器日志尾部 ---"
          docker logs gw-smoke 2>&1 | tail -80 || true

